<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <style>
    body { background: black; color: white; font-family: Arial; padding: 20px; text-align: center; }
    h1 { color: gold; }
    input { background: #222; color: white; border: 1px solid gold; padding: 12px; border-radius: 8px; font-size: 16px; width: 100%; margin: 10px 0; box-sizing: border-box; }
    button { background: gold; color: black; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
    .card { background: #111; border: 1px solid gold; border-radius: 15px; padding: 25px; margin: 20px 0; }
    .temp { font-size: 60px; color: gold; font-weight: bold; }
    .city { font-size: 28px; margin-bottom: 5px; }
    .desc { font-size: 18px; color: #aaa; text-transform: capitalize; }
    .details { display: flex; justify-content: space-around; margin-top: 20px; }
    .detail-item { font-size: 14px; color: #aaa; }
    .detail-item span { display: block; color: gold; font-size: 20px; font-weight: bold; }
    #error { color: red; font-size: 16px; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>🌤️ Weather App</h1>

  <input id="cityInput" placeholder="City ka naam likho... (e.g. Karachi)">
  <button onclick="getWeather()">🔍 Search</button>

  <div id="error"></div>
  <div id="weatherCard" style="display:none">
    <div class="card">
      <div class="city" id="cityName"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
      <div class="details">
        <div class="detail-item">
          Humidity<span id="humidity"></span>
        </div>
        <div class="detail-item">
          Wind<span id="wind"></span>
        </div>
        <div class="detail-item">
          Feels Like<span id="feels"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = '34656085875f46fceb2eea8a15bb4c87';

    async function getWeather() {
      let city = document.getElementById('cityInput').value;
      if(city === '') return;

      document.getElementById('error').innerText = '';

      try {
        let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;
        let response = await fetch(url);
        let data = await response.json();

        if(data.cod !== 200) {
          document.getElementById('error').innerText = '❌ City nahi mili!';
          document.getElementById('weatherCard').style.display = 'none';
          return;
        }

        document.getElementById('cityName').innerText = '📍 ' + data.name + ', ' + data.sys.country;
        document.getElementById('temp').innerText = Math.round(data.main.temp) + '°C';
        document.getElementById('desc').innerText = data.weather[0].description;
        document.getElementById('humidity').innerText = data.main.humidity + '%';
        document.getElementById('wind').innerText = Math.round(data.wind.speed) + ' km/h';
        document.getElementById('feels').innerText = Math.round(data.main.feels_like) + '°C';

        document.getElementById('weatherCard').style.display = 'block';

      } catch(e) {
        document.getElementById('error').innerText = '❌ Error aaya!';
      }
    }
  </script>

</body>
</html>
